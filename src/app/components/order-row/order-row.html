<td></td>
<td></td>
<td>{{ order().id }}</td>
<td>{{ order().side }}</td>
<td class="numeric">{{ order().size | number: '1.0-5' }}</td>
<td>{{ order().openTime | date: 'dd.MM.yyyy HH:mm:ss' }}</td>
<td class="numeric">{{ order().openPrice | number: '1.0-5' }}</td>
<td class="numeric">{{ order().swap | number: '1.0-8' }}</td>
<td class="numeric" [class]="order().profit | profitClass">{{ order().profit | number: '1.0-4' }}</td>
<td class="actions">
  <button
    type="button"
    class="remove"
    [attr.aria-label]="'Remove order ' + order().id"
    (click)="onRemove()"
  >
    <svg class="remove-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="m336-280-56-56 144-144-144-143 56-56 144 144 143-144 56 56-144 143 144 144-56 56-143-144-144 144Z"/></svg>
  </button>
</td>
