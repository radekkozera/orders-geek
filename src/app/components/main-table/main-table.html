<table class="table">
  <thead>
    <tr>
      <th class="toggle-col"></th>
      <th>Symbol</th>
      <th>Order ID</th>
      <th>Side</th>
      <th class="numeric">Size</th>
      <th>Open Time</th>
      <th class="numeric">Open Price</th>
      <th class="numeric">Swap</th>
      <th class="numeric">Profit</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (group of groups(); track group.symbol) {
      <app-order-group-row
        [group]="group"
        [expanded]="expanded().includes(group.symbol)"
        (click)="onToggle(group.symbol)"
        (remove)="onRemoveGroup($event)"
      />
      @if (expanded().includes(group.symbol)) {
        @for (order of group.orders; track order.id) {
          <app-order-row [order]="order" (remove)="onRemoveOrder($event)" />
        }
      }
    } @empty {
      <tr>
        <td class="empty" colspan="10">No orders</td>
      </tr>
    }
  </tbody>
</table>
